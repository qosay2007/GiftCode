<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GiftCode | متجر الموظف</title><style>*{box-sizing:border-box}body{margin:0;background:#130b1b;color:#fff;font:16px system-ui}main{max-width:980px;margin:auto;padding:24px}a{color:#ffb2d7}h1{font-size:clamp(28px,6vw,52px)}p{line-height:1.8;color:#dbc5d7}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:15px;margin:24px 0}.card{background:#2a1930;border:1px solid #75476b;border-radius:16px;padding:18px}.emoji{font-size:56px}.price{font-weight:900;font-size:24px;color:#ffb3dc}.btn{display:block;background:var(--accent,#e32989);color:#fff;text-decoration:none;padding:12px;border-radius:10px;text-align:center;margin-top:15px}#error{color:#ffb6c3}</style></head><body><main><a href="./">🎁 GiftCode</a><header><h1 id="title">متجر الهدايا</h1><p id="description">جاري تحميل المتجر...</p></header><div class="cards" id="cards"></div><p id="error" role="status"></p><p>كل الأسعار بالدينار الأردني. الطلب يُسجّل للمراجعة، والدفع الإلكتروني والتسليم التلقائي غير مفعّلين بعد.</p></main><script>
const slug=new URLSearchParams(location.search).get('staff'),$=id=>document.getElementById(id),base={box:1,love:1,birthday:1,rose:1,memory:2,stars:1,thanks:1,friend:1,success:1,vip:3},gifts=[['box','صندوق المفاجأة','🎁'],['love','رسالة حب','💖'],['birthday','عيد ميلاد','🎂'],['rose','وردة','🌹'],['memory','ذكريات','📸'],['stars','نجمة','🌟'],['thanks','شكر','🫶'],['friend','صداقة','🤝'],['success','نجاح','🏆'],['vip','VIP','💎']];const api='https://zjuhculnvtkzggrxkeqq.supabase.co/rest/v1/',opts={headers:{apikey:'sb_publishable_3ChSqBFom1RPFlPgSH2rcw_hNQXLiBC'}};
async function fetchRows(path){const r=await fetch(api+path,opts);if(!r.ok)throw Error('تعذّر تحميل المتجر');return r.json()}
(async()=>{try{if(!slug||!/^[a-z0-9][a-z0-9-]{2,29}$/.test(slug))throw Error('رابط الموظف غير صالح');const staff=await fetchRows('giftcode_staff?select=user_id,display_name&active=eq.true&slug=eq.'+encodeURIComponent(slug));if(!staff.length)throw Error('المتجر غير متاح');const id=staff[0].user_id;const [prices,store]=await Promise.all([fetchRows('giftcode_staff_prices?select=gift_type,price_jod&staff_id=eq.'+id),fetchRows('giftcode_staff_storefronts?select=headline,description,accent_color&staff_id=eq.'+id)]);const custom=Object.fromEntries(prices.map(p=>[p.gift_type,Number(p.price_jod)]));$('title').textContent=store[0]?.headline||'متجر '+staff[0].display_name;$('description').textContent=store[0]?.description||'اختر هديتك وصمّم رسالتك';document.documentElement.style.setProperty('--accent',store[0]?.accent_color||'#e32989');const root=$('cards');for(const [type,title,emoji] of gifts){const card=document.createElement('article');card.className='card';const icon=document.createElement('div');icon.className='emoji';icon.textContent=emoji;const h=document.createElement('h2');h.textContent=title;const p=document.createElement('div');p.className='price';p.textContent=(custom[type]??base[type]).toFixed(2)+' د.أ';const a=document.createElement('a');a.className='btn';a.href='order.html?staff='+encodeURIComponent(slug)+'&gift='+encodeURIComponent(type);a.textContent='اطلب الهدية';card.append(icon,h,p,a);root.append(card)}}catch(e){$('description').textContent='';$('error').textContent=e.message}})();
</script></body></html>
