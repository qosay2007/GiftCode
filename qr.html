<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GiftCode | QR للهدية</title><style>*{box-sizing:border-box}body{background:#160d1c;color:white;font:16px system-ui;margin:0}main{max-width:600px;margin:auto;padding:24px}a{color:#ff9aca}.panel{background:#2b1b32;border:1px solid #7b4668;border-radius:18px;padding:20px;margin:18px 0}input{width:100%;background:#1d1025;border:1px solid #99577b;color:white;border-radius:10px;padding:12px;font:inherit}button{border:0;background:#e62d89;color:white;padding:13px 20px;border-radius:10px;font:inherit;cursor:pointer;margin:10px 5px}#qr{background:white;padding:18px;display:flex;justify-content:center;min-height:240px;align-items:center;border-radius:14px}#qr canvas{max-width:100%;height:auto}p{line-height:1.8;color:#e2c8d7}</style></head><body><main><a href="./">← متجر GiftCode</a><h1>📱 رمز QR لهديتك</h1><p>حوّل رابط الهدية التفاعلية إلى QR قابل للحفظ والطباعة، بدون رفع الرابط إلى خادم.</p><section class="panel"><label for="url">رابط الهدية</label><input id="url" type="url" placeholder="https://qosay2007.github.io/GiftCode/experience.html#gift=..."><button id="generate">إنشاء QR</button><button id="download" disabled>حفظ صورة PNG</button><div id="qr" role="img" aria-label="رمز QR"></div><p id="status" role="status"></p></section><p>تنبيه: أي شخص يصوّر QR أو يحصل على الرابط يستطيع فتح الهدية. لا تضع بيانات سرية في الرسالة.</p></main><script src="assets/qrcode.min.js"></script><script>
const $=id=>document.getElementById(id);function make(){const value=$('url').value.trim();$('download').disabled=true;$('qr').replaceChildren();if(!value.startsWith('https://qosay2007.github.io/GiftCode/experience.html')){$('status').textContent='أدخل رابط هدية GiftCode صحيح.';return}if(!window.QRCode){$('status').textContent='تعذّر تحميل مولّد QR المحلي. أعد تحميل الصفحة.';return}try{new QRCode($('qr'),{text:value,width:320,height:320,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});$('status').textContent='الرمز جاهز للحفظ.';$('download').disabled=false}catch(err){$('status').textContent='تعذّر إنشاء QR: '+err.message}} $('generate').onclick=make;$('download').onclick=()=>{const c=$('qr').querySelector('canvas');const img=$('qr').querySelector('img');const data=c?.toDataURL('image/png')||img?.src;if(!data)return;const a=document.createElement('a');a.href=data;a.download='GiftCode-QR.png';a.click()};const url=new URLSearchParams(location.search).get('url');if(url){$('url').value=url;make()}
</script></body></html>
