<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>GiftCode | إدارة آمنة</title><style>*{box-sizing:border-box}body{background:#150d1b;color:#fff;font:16px system-ui;margin:0}main{max-width:1100px;margin:auto;padding:22px}a{color:#ffa5ce}.panel{background:#2b1a32;border:1px solid #7b476b;border-radius:16px;padding:20px;margin:18px 0}input,select,textarea{font:inherit;color:white;background:#1c1024;border:1px solid #925579;border-radius:9px;padding:11px;width:100%;margin:6px 0}button{font:inherit;color:white;background:#d72a86;border:0;border-radius:10px;padding:12px;cursor:pointer;margin:6px}button:disabled{opacity:.5}table{width:100%;border-collapse:collapse;min-width:650px}td,th{padding:10px;text-align:right;border-bottom:1px solid #65445e}td{overflow-wrap:anywhere}.scroll{overflow:auto}.muted{color:#c9b0c7}#dashboard{display:none}#status{color:#ffb5d7}small{color:#dbc2d4}</style></head><body><main><h1>🎁 GiftCode | لوحة الإدارة</h1><p><a href="../">العودة للمتجر</a></p><section id="login" class="panel"><h2>دخول المدير</h2><p class="muted">الدخول لا يكفي وحده؛ يجب إضافة حسابك إلى قائمة المديرين المصرح لهم في Supabase.</p><form id="loginform"><label>البريد الإلكتروني<input type="email" id="email" autocomplete="username" required></label><label>كلمة المرور<input type="password" id="password" autocomplete="current-password" required></label><button type="submit">تسجيل الدخول</button></form></section><section id="dashboard"><button id="logout">تسجيل الخروج</button><div class="panel"><h2>الطلبات</h2><button id="refresh">تحديث</button><div class="scroll"><table><thead><tr><th>الرقم</th><th>النوع</th><th>المستلم</th><th>المرسل</th><th>الرسالة</th><th>التواصل</th><th>السعر</th><th>الحالة</th><th>تحديث</th></tr></thead><tbody id="orders"></tbody></table></div></div><div class="panel"><h2>طرق الدفع اليدوية</h2><p class="muted">تظل مخفية عن العملاء حتى تفعّلها. لا تضع معلومات سرية في التعليمات العامة.</p><form id="paymentform"><label>اسم الطريقة<input id="paylabel" maxlength="60" required placeholder="CliQ أو محفظة إلكترونية"></label><label>تعليمات الدفع<textarea id="payinstructions" maxlength="300" required placeholder="اسم المستفيد وطريقة إرسال مرجع التحويل"></textarea></label><button type="submit">إضافة طريقة غير مفعلة</button></form><div id="methods"></div></div></section><p id="status" role="status"></p></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const supabase=createClient('https://zjuhculnvtkzggrxkeqq.supabase.co','sb_publishable_3ChSqBFom1RPFlPgSH2rcw_hNQXLiBC');const $=id=>document.getElementById(id),status=t=>$('status').textContent=t;let authorized=false;
const statuses=['pending','awaiting_payment','payment_review','paid','delivered','cancelled'];
async function check(){const {data:{user}}=await supabase.auth.getUser();if(!user){authorized=false;$('login').style.display='block';$('dashboard').style.display='none';return}const {data,error}=await supabase.from('giftcode_admins').select('user_id').eq('user_id',user.id).maybeSingle();authorized=!!data&&!error;$('login').style.display=authorized?'none':'block';$('dashboard').style.display=authorized?'block':'none';if(authorized){status('تم التحقق من صلاحيات المدير.');await refresh()}else status('الحساب ليس ضمن قائمة المديرين. معرف الحساب: '+user.id)}
$('loginform').onsubmit=async e=>{e.preventDefault();status('جاري التحقق...');const {error}=await supabase.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){status(error.message);return}await check()};
$('logout').onclick=async()=>{await supabase.auth.signOut();await check();status('تم تسجيل الخروج')};
function cell(tr,value){const td=document.createElement('td');td.textContent=value??'—';tr.append(td);return td}
async function refresh(){if(!authorized)return;const {data,error}=await supabase.from('giftcode_orders').select('id,gift_type,recipient_name,sender_name,gift_message,contact,price_jod,status,created_at').order('created_at',{ascending:false}).limit(100);if(error){status('تعذّر تحميل الطلبات: '+error.message);return}const body=$('orders');body.replaceChildren();for(const o of data){const tr=document.createElement('tr');[o.id,o.gift_type,o.recipient_name,o.sender_name,o.gift_message,o.contact,o.price_jod].forEach(v=>cell(tr,v));const td=document.createElement('td'),sel=document.createElement('select');statuses.forEach(v=>{const op=document.createElement('option');op.value=v;op.textContent=v;op.selected=v===o.status;sel.append(op)});td.append(sel);tr.append(td);const action=document.createElement('td'),btn=document.createElement('button');btn.textContent='حفظ';btn.onclick=async()=>{btn.disabled=true;const {error}=await supabase.from('giftcode_orders').update({status:sel.value,updated_at:new Date().toISOString()}).eq('id',o.id);status(error?'فشل الحفظ: '+error.message:'تم تحديث الطلب');btn.disabled=false};action.append(btn);tr.append(action);body.append(tr)}await loadMethods()}
async function loadMethods(){const {data,error}=await supabase.from('giftcode_payment_methods').select('id,label,instructions,active').order('created_at');if(error){status(error.message);return}const root=$('methods');root.replaceChildren();for(const m of data){const div=document.createElement('div');div.className='panel';const title=document.createElement('strong');title.textContent=m.label+' — '+(m.active?'مفعّلة':'معطّلة');const p=document.createElement('p');p.textContent=m.instructions;const b=document.createElement('button');b.textContent=m.active?'تعطيل':'تفعيل';b.onclick=async()=>{const {error}=await supabase.from('giftcode_payment_methods').update({active:!m.active}).eq('id',m.id);status(error?error.message:'تم تحديث الطريقة');if(!error)await loadMethods()};div.append(title,p,b);root.append(div)}}
$('paymentform').onsubmit=async e=>{e.preventDefault();if(!authorized)return;const {error}=await supabase.from('giftcode_payment_methods').insert({label:$('paylabel').value.trim(),instructions:$('payinstructions').value.trim(),active:false});status(error?error.message:'تمت إضافة الطريقة وهي معطّلة حتى تفعّلها');if(!error){e.target.reset();await loadMethods()}};
$('refresh').onclick=refresh;await check();
</script></body></html>
