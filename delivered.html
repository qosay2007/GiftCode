<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GiftCode | هديتك الخاصة</title><style>body{margin:0;background:radial-gradient(circle at top,#4b1c43,#100a1a 70%);color:#fff;font:17px system-ui;text-align:center}main{max-width:680px;margin:10vh auto;padding:22px}section{background:#27152d;border:1px solid #99567e;border-radius:24px;padding:28px;box-shadow:0 20px 70px #0008}h1{font-size:clamp(28px,7vw,45px)}p{line-height:1.8;color:#e4cbda}a{display:inline-block;background:#e72b8b;border-radius:15px;padding:15px 22px;color:white;text-decoration:none;font-weight:800;margin:16px}#status{min-height:50px}</style></head><body><main><section><h1>🎁 هدية صُنعت خصيصًا لك</h1><p id="status">جاري التحقق من الهدية...</p><div id="gift" hidden><h2 id="title"></h2><p>هذه الهدية جاهزة للفتح بعد اعتماد الدفع.</p><a id="open">✨ المس هنا لفتح المفاجأة</a></div></section></main><script>const token=new URLSearchParams(location.search).get('token')||'';const $=id=>document.getElementById(id);(async()=>{if(!/^[0-9a-f-]{36}$/i.test(token)){$('status').textContent='رابط الهدية غير صالح.';return}try{const r=await fetch('https://zjuhculnvtkzggrxkeqq.supabase.co/functions/v1/giftcode-delivery?token='+encodeURIComponent(token),{cache:'no-store'});const d=await r.json();if(!r.ok||!d.gift)throw Error('الهدية لم تُعتمد للدفع بعد، أو الرابط غير صحيح.');const g=d.gift;$('title').textContent='إلى '+(g.to||'شخص مميز');try{sessionStorage.setItem('giftcode-verified-gift',JSON.stringify({gift:{id:g.id,to:g.to,from:g.from,msg:g.msg,tier:g.tier||'digital'},media:d.media||{},verifiedAt:Date.now()}))}catch{throw Error('تعذّر فتح الهدية في هذا المتصفح. فعّل تخزين الجلسة وحاول مجددًا.')} $('open').href='experience.html?secure=1';$('status').textContent='تم اعتماد هديتك، والمفاجأة بانتظارك.';$('gift').hidden=false}catch(e){$('status').textContent=e.message}})()</script></body></html>
