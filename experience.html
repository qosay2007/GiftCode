<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#180d1e"><title>GiftCode | تجارب الهدايا</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#512345,#140b1c 65%);color:#fff;font:16px system-ui,sans-serif;min-height:100vh}.wrap{max-width:980px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;gap:12px;align-items:center}a{color:#ffa6d1;text-decoration:none}h1{text-align:center;font-size:clamp(28px,6vw,45px);margin-bottom:8px}.intro{text-align:center;color:#d9bfd1;line-height:1.8}.tabs{display:flex;gap:10px;overflow-x:auto;padding:20px 0}.tab,.action{border:1px solid #9c4d7b;border-radius:25px;background:#37203b;color:white;font:inherit;padding:12px 17px;cursor:pointer;min-height:44px;white-space:nowrap}.tab.active,.action{background:#e72a8d;border-color:#e72a8d}.stage{position:relative;min-height:420px;display:grid;place-items:center;text-align:center;overflow:hidden;border:1px solid #8c416d;border-radius:24px;background:radial-gradient(circle,#682448,#1c0c24 72%);padding:20px}.stage:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#ffa2d2 1px,transparent 2px);background-size:37px 43px;opacity:.3}.scene{z-index:1;max-width:600px}.big{display:block;font-size:clamp(90px,19vw,155px);filter:drop-shadow(0 0 25px #ff3c9b);transition:transform .7s,opacity .6s;animation:float 3s infinite ease-in-out}.scene h2{font-size:clamp(24px,6vw,38px);margin:10px 0}.scene p{line-height:1.8;color:#f7d9ea;max-width:480px}.message{opacity:0;transform:translateY(15px);transition:all .8s;min-height:35px}.revealed .message{opacity:1;transform:none}.revealed .big{transform:scale(1.18) rotate(-8deg)}.controls{text-align:center;margin:18px 0}.note{background:#312035;border-right:4px solid #f75fa9;padding:15px;border-radius:12px;color:#edd5e4;line-height:1.8}.confetti{position:absolute;top:-25px;left:var(--x);font-size:var(--s);animation:fall var(--t) linear forwards;z-index:2;pointer-events:none}.cake .big{cursor:pointer}.cake .big:active{transform:scale(.9)}@keyframes float{50%{translate:0 -10px}}@keyframes fall{to{transform:translateY(520px) rotate(650deg);opacity:0}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}@media(max-width:500px){.wrap{padding:14px}.stage{min-height:400px}.tabs{padding:14px 0}}
</style></head><body><div class="wrap"><header><a href="./">← المتجر</a><strong>🎁 GiftCode</strong></header><h1>افتح المفاجأة بنفسك ✨</h1><p class="intro">تجارب تفاعلية جديدة، كل هدية إلها حركة ومفاجأة مختلفة</p><nav id="tabs" class="tabs" aria-label="أنواع الهدايا"></nav><section class="stage" id="stage"><div class="scene" id="scene"><span class="big" id="emoji">🎁</span><h2 id="title"></h2><p id="hint"></p><p class="message" id="message" aria-live="polite"></p></div></section><div class="controls"><button class="action" id="reveal">✨ افتح المفاجأة</button> <button class="tab" id="reset">↻ من جديد</button> <button class="tab" id="share">🔗 مشاركة</button></div><p class="note">تجارب مجانية للمعاينة فقط. لا يوجد دفع أو تسليم نهائي حاليًا. يمكن استخدامها على الآيفون والأندرويد بدون تسجيل دخول.</p></div><script>
const gifts=[
{id:'box',title:'صندوق المفاجأة',before:'🎁',after:'💝',hint:'اضغط الزر لفتح الصندوق!',msg:'كل لحظة حلوة بتستاهل مفاجأة منك ❤️',button:'🎁 افتح الصندوق'},
{id:'love',title:'رسالة من القلب',before:'💌',after:'💖',hint:'افتح الرسالة وشوف الكلام اللي جواها',msg:'وجودك أجمل هدية بالحياة، وإنت دايمًا بالقلب ❤️',button:'💌 افتح الرسالة'},
{id:'birthday',title:'عيد ميلاد سعيد',before:'🎂',after:'🎉',hint:'اطفئ الشموع وابدأ الاحتفال!',msg:'كل سنة وإنت بخير! أمنياتك كلها تتحقق 🎊',button:'🕯️ اطفئ الشموع'},
{id:'rose',title:'وردة لا تذبل',before:'🌱',after:'🌹',hint:'خلّي الوردة تزهر بلمسة',msg:'هاي الوردة إلك، لأنك بتستاهل كل الجمال 🌹',button:'🌸 خلّيها تزهر'},
{id:'memory',title:'صندوق الذكريات',before:'📦',after:'📸',hint:'افتح صندوق الذكريات',msg:'أحلى الذكريات هي اللحظات اللي بتجمعنا 💗',button:'📸 افتح الذكريات'},
{id:'stars',title:'نجمة أمنياتك',before:'🌙',after:'🌟',hint:'اطلب أمنية وافتح السماء',msg:'بتمنالك أيام مليانة نور ونجاح ✨',button:'🌟 حقّق الأمنية'},
{id:'thanks',title:'شكراً من القلب',before:'🫶',after:'🌷',hint:'رسالة امتنان لشخص مميز',msg:'شكراً لأنك موجود وبتخلي كل شي أحلى 🌷',button:'💗 اعرض الشكر'},
{id:'friend',title:'هدية الصداقة',before:'🤝',after:'🥰',hint:'فاجئ صاحبك برسالة حلوة',msg:'الأصحاب الحلوين مثل النجوم، دايمًا منوّرين ⭐',button:'🎈 افتح الهدية'},
{id:'success',title:'مبروك النجاح',before:'🎓',after:'🏆',hint:'احتفل بالإنجاز!',msg:'مبروك! تعبك ما راح هدر، ومنها للأعلى 🏆',button:'🎉 ابدأ الاحتفال'},
{id:'vip',title:'مفاجأة VIP',before:'🔒',after:'💎',hint:'افتح الصندوق المميز',msg:'إنت شخص استثنائي، وهاي المفاجأة إلك 💎',button:'🔓 افتح المفاجأة'}
];const $=id=>document.getElementById(id);let index=0,opened=false;
function choose(i){index=i;opened=false;const g=gifts[i];$('stage').classList.remove('revealed');$('stage').querySelectorAll('.confetti').forEach(x=>x.remove());$('emoji').textContent=g.before;$('title').textContent=g.title;$('hint').textContent=g.hint;$('message').textContent=g.msg;$('reveal').textContent=g.button;$('reveal').disabled=false;$('tabs').replaceChildren();gifts.forEach((v,j)=>{const b=document.createElement('button');b.className='tab'+(i===j?' active':'');b.textContent=v.title;b.onclick=()=>choose(j);$('tabs').append(b)})}
function reveal(){if(opened)return;opened=true;$('emoji').textContent=gifts[index].after;$('stage').classList.add('revealed');$('reveal').textContent='💗 تم فتح الهدية';$('reveal').disabled=true;for(let n=0;n<38;n++){const s=document.createElement('span');s.className='confetti';s.textContent=['💗','✦','✨','🌸'][n%4];s.style.setProperty('--x',(n*47%98)+'%');s.style.setProperty('--s',(14+n%17)+'px');s.style.setProperty('--t',(2+n%4)+'s');s.style.animationDelay=(n%8*.12)+'s';$('stage').append(s)}}
async function share(){const url=location.href.split('#')[0]+'#'+gifts[index].id;try{if(navigator.share){await navigator.share({title:gifts[index].title,url});return}if(navigator.clipboard){await navigator.clipboard.writeText(url);alert('تم نسخ الرابط');return}}catch(e){if(e.name==='AbortError')return}prompt('انسخ الرابط',url)}
$('reveal').onclick=reveal;$('reset').onclick=()=>choose(index);$('share').onclick=share;const hash=location.hash.slice(1);choose(Math.max(0,gifts.findIndex(g=>g.id===hash)));addEventListener('hashchange',()=>choose(Math.max(0,gifts.findIndex(g=>g.id===location.hash.slice(1)))));
</script></body></html>
