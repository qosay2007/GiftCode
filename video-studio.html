<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GiftCode | استوديو فيديو الهدايا</title><style>*{box-sizing:border-box}body{margin:0;background:#130b1b;color:#fff;font:16px system-ui}.wrap{max-width:950px;margin:auto;padding:20px}a{color:#ffa5d1;text-decoration:none}h1{font-size:clamp(26px,5vw,40px)}p{color:#e2c9d8;line-height:1.8}.layout{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{background:#28182e;border:1px solid #79466b;border-radius:18px;padding:20px}label{display:block;margin:14px 0 6px}input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #8b5074;background:#1b1024;color:white;font:inherit}textarea{min-height:85px}canvas{width:100%;aspect-ratio:9/16;border-radius:15px;background:#2c1034;display:block;max-height:620px;object-fit:contain}.btn{background:#e32989;color:white;border:0;border-radius:13px;padding:13px 18px;font:inherit;cursor:pointer;margin:5px 0;min-height:45px}.btn:disabled{opacity:.5}.notice{border-right:4px solid #ffb66b;background:#3a263b;padding:12px;border-radius:10px}#status{color:#ffb9d8}@media(max-width:700px){.layout{grid-template-columns:1fr}canvas{max-height:480px}}</style></head><body><main class="wrap"><a href="./">← متجر GiftCode</a><h1>🎬 استوديو فيديو الهدايا</h1><p>صمّم فيديو تهنئة عمودي 9:16 برسالة خاصة، وشاهد العرض المتحرك قبل تصديره.</p><div class="layout"><section class="panel"><label for="theme">نوع الفيديو</label><select id="theme"><option value="love">💖 حب</option><option value="birthday">🎂 عيد ميلاد</option><option value="rose">🌹 ورد</option><option value="success">🏆 نجاح</option><option value="vip">💎 VIP</option></select><label for="name">اسم المستلم</label><input id="name" maxlength="45" placeholder="مثلاً: سارة"><label for="message">رسالة الفيديو</label><textarea id="message" maxlength="150" placeholder="اكتب رسالتك..."></textarea><label for="duration">المدة</label><select id="duration"><option value="8">8 ثوانٍ</option><option value="12">12 ثانية</option><option value="15">15 ثانية</option></select><button class="btn" id="play">▶ تشغيل المعاينة</button> <button class="btn" id="export">⬇ تصدير فيديو WebM</button><p id="status" role="status">جاهز للمعاينة.</p><p class="notice">التصدير يعتمد على دعم متصفحك لتسجيل Canvas بصيغة WebM، وقد لا يعمل على بعض إصدارات Safari في الآيفون. الفيديو بلا موسيقى حاليًا، ولا تُرفع الرسالة إلى أي خادم.</p></section><section class="panel"><canvas id="canvas" width="540" height="960" aria-label="معاينة الفيديو"></canvas></section></div></main><script>
const $=id=>document.getElementById(id),c=$('canvas'),ctx=c.getContext('2d'),themes={love:['💖','#4b123d','#ed4599','رسالة من القلب'],birthday:['🎂','#32164d','#ffa65e','كل عام وإنت بخير'],rose:['🌹','#3c1438','#e85884','وردة من القلب'],success:['🏆','#162c49','#f7be5c','مبروك النجاح'],vip:['💎','#241541','#cba2ff','إنت شخص مميز']};let frame=0,playing=false,raf=0;
function wrap(text,max=22){const words=String(text).split(/\s+/),lines=[];let line='';for(const word of words){if((line+' '+word).trim().length>max&&line){lines.push(line);line=word}else line=(line+' '+word).trim()}if(line)lines.push(line);return lines.slice(0,6)}
function draw(t){const [emoji,bg,accent,title]=themes[$('theme').value],w=c.width,h=c.height;const grad=ctx.createLinearGradient(0,0,w,h);grad.addColorStop(0,bg);grad.addColorStop(1,'#10091c');ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);for(let i=0;i<55;i++){const x=(i*173+Math.sin(t*.7+i)*40)%w,y=(i*271-t*35*(1+i%3)*.2+h*3)%h;ctx.globalAlpha=.3+.5*(.5+.5*Math.sin(t*2+i));ctx.fillStyle=accent;ctx.beginPath();ctx.arc(x,y,2+i%4,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;const pulse=1+.04*Math.sin(t*3);ctx.save();ctx.translate(w/2,300+15*Math.sin(t*2));ctx.scale(pulse,pulse);ctx.textAlign='center';ctx.font='150px system-ui';ctx.fillText(emoji,0,50);ctx.restore();ctx.textAlign='center';ctx.fillStyle='#fff';ctx.shadowColor=accent;ctx.shadowBlur=18;ctx.font='bold 46px system-ui';ctx.fillText(title,w/2,485);ctx.shadowBlur=0;ctx.fillStyle='#ffd6eb';ctx.font='bold 36px system-ui';const name=$('name').value.trim();if(name)ctx.fillText('إلى '+name.slice(0,26),w/2,550);ctx.fillStyle='#fff';ctx.font='29px system-ui';const lines=wrap($('message').value.trim()||'هدية صغيرة لشخص غالي 💗');lines.forEach((line,i)=>ctx.fillText(line,w/2,620+i*45));ctx.fillStyle=accent;ctx.font='bold 25px system-ui';ctx.fillText('GiftCode 🎁',w/2,905)}
function animate(start){const dur=Number($('duration').value);playing=true;function tick(now){if(!playing)return;const t=(now-start)/1000;draw(t);if(t<dur)raf=requestAnimationFrame(tick);else{playing=false;$('status').textContent='انتهت المعاينة.'}}raf=requestAnimationFrame(tick)}
$('play').onclick=()=>{cancelAnimationFrame(raf);playing=false;animate(performance.now());$('status').textContent='المعاينة تعمل الآن...'};
$('export').onclick=async()=>{if(!c.captureStream||typeof MediaRecorder==='undefined'){alert('متصفحك لا يدعم تصدير الفيديو. جرّب متصفح كمبيوتر يدعم WebM.');return}const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));if(!mime){alert('صيغة WebM غير مدعومة في هذا المتصفح.');return}cancelAnimationFrame(raf);playing=false;const btn=$('export');btn.disabled=true;const duration=Number($('duration').value);let recorder;try{const stream=c.captureStream(30);const chunks=[];recorder=new MediaRecorder(stream,{mimeType:mime});recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{const blob=new Blob(chunks,{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='GiftCode-'+$('theme').value+'.webm';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);stream.getTracks().forEach(t=>t.stop());btn.disabled=false;$('status').textContent='تم تجهيز الفيديو للتنزيل.'};recorder.onerror=()=>{$('status').textContent='تعذّر تصدير الفيديو.';btn.disabled=false};recorder.start();$('status').textContent='جاري تسجيل الفيديو...';const start=performance.now();function recordFrame(now){const t=Math.min((now-start)/1000,duration);draw(t);if(t<duration)requestAnimationFrame(recordFrame);else if(recorder.state==='recording')recorder.stop()}requestAnimationFrame(recordFrame)}catch(e){btn.disabled=false;$('status').textContent='تعذّر بدء التسجيل: '+e.message}};
['theme','name','message'].forEach(id=>$(id).addEventListener('input',()=>{if(!playing)draw(0)}));draw(0);
</script></body></html>
