<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#170b1b"><title>GiftCode | معاينات الهدايا</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#48143c,#110916 65%);color:white;font-family:system-ui,-apple-system,sans-serif;min-height:100vh}.wrap{max-width:920px;margin:auto;padding:20px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}a{color:#ff9dcc;text-decoration:none}h1{text-align:center;margin:28px 0 8px;font-size:clamp(26px,5vw,43px)}p{line-height:1.8;color:#e5ccdc}.subtitle{text-align:center}.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 0}.tab,button{font:inherit;cursor:pointer;border-radius:30px;border:1px solid #80456d;padding:12px 16px;background:#32182d;color:#fff;white-space:nowrap}.tab.active,button.primary{background:#ec2789;border-color:#ec2789}.stage{height:min(60vh,480px);min-height:310px;position:relative;overflow:hidden;border:1px solid #74395d;border-radius:24px;background:radial-gradient(circle,#6a1b4b 0,#1b0b21 72%);display:grid;place-items:center;text-align:center;isolation:isolate}.stars{position:absolute;inset:0;background-image:radial-gradient(#ff9ec9 1px,transparent 2px);background-size:38px 40px;opacity:.6;animation:move 10s linear infinite}.orb{position:absolute;width:230px;height:230px;border-radius:50%;border:3px solid #ff50aa;box-shadow:0 0 30px #fc2189,inset 0 0 50px #f8218a88;animation:pulse 2.5s infinite alternate}.content{position:relative;z-index:2;padding:24px}.emoji{font-size:clamp(70px,16vw,130px);filter:drop-shadow(0 0 24px #ff4ca2);display:block;animation:float 2.5s ease-in-out infinite}.caption{font-size:clamp(22px,5vw,37px);font-weight:900;text-shadow:0 0 15px #ff3e9c;animation:appear 1s both}.message{font-size:17px;max-width:420px;margin:auto}.heart{position:absolute;bottom:-45px;font-size:24px;animation:rise var(--duration,5s) linear infinite;left:var(--x,50%);opacity:0}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:20px 0}.notice{background:#2b1b2c;border-right:4px solid #fa64aa;border-radius:10px;padding:13px;margin:20px 0}.hidden{display:none}.stage.paused *{animation-play-state:paused!important}@keyframes float{50%{transform:translateY(-15px) scale(1.06)}}@keyframes pulse{to{transform:scale(1.12);opacity:.7}}@keyframes rise{15%{opacity:.9}85%{opacity:.8}100%{transform:translateY(-520px) rotate(30deg);opacity:0}}@keyframes move{to{background-position:75px 70px}}@keyframes appear{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}@media(max-width:500px){.wrap{padding:14px}.stage{min-height:350px}.orb{width:190px;height:190px}}
</style></head><body><div class="wrap"><header><a href="./">← الرجوع للمتجر</a><b>🎁 GiftCode</b></header><h1>✨ شاهد الهدايا وهي تتحرك</h1><p class="subtitle">معاينات تفاعلية مجانية، بدون تسجيل دخول</p><nav class="tabs" id="tabs" aria-label="اختيار الهدية"></nav><section class="stage" id="stage" aria-label="معاينة متحركة"><div class="stars"></div><div class="orb"></div><div id="hearts"></div><div class="content"><span class="emoji" id="emoji">💖</span><div class="caption" id="caption"></div><p class="message" id="message"></p></div></section><div class="controls"><button id="pause" onclick="togglePause()">⏸ إيقاف الحركة</button><button onclick="replay()">↻ إعادة العرض</button><button class="primary" onclick="share()">🔗 مشاركة المعاينة</button></div><p class="notice">هذه مؤثرات متحركة أصلية تعمل داخل المتصفح، وليست فيديوهات مسجلة. لا يوجد شراء أو تسليم نهائي في هذه النسخة التجريبية.</p><p class="subtitle"><a href="./#catalog">اختيار قالب وتصميم رسالة خاصة ←</a></p></div><script>
const demos=[['love','رسالة حب','💖','إنت أجمل صدفة بحياتي ❤️'],['rose','وردة أبدية','🌹','وردة بتضل تحكي عن المحبة'],['birthday','عيد ميلاد','🎂','كل عام وإنت بألف خير 🎉'],['surprise','صندوق مفاجأة','🎁','في مفاجأة حلوة مستنيتك!'],['memory','ذكرياتنا','📸','كل لحظة معك حكاية جميلة'],['vip','هدية VIP','💎','إنت تستاهل كل شيء مميز ✨']];let current=0,paused=false;const $=id=>document.getElementById(id);
function show(i){current=i;$('tabs').replaceChildren();demos.forEach((d,j)=>{const b=document.createElement('button');b.className='tab'+(i===j?' active':'');b.textContent=d[1];b.onclick=()=>show(j);$('tabs').append(b)});const d=demos[i];$('emoji').textContent=d[2];$('caption').textContent=d[1];$('message').textContent=d[3];$('hearts').replaceChildren();for(let n=0;n<15;n++){const s=document.createElement('span');s.className='heart';s.textContent=n%3===0?'✦':'♥';s.style.setProperty('--x',((n*37)%97)+'%');s.style.setProperty('--duration',(3+n%5)+'s');s.style.animationDelay=(-n*.42)+'s';s.style.color=n%2?'#ff62a9':'#ffd2ea';$('hearts').append(s)}$('stage').classList.remove('paused');paused=false;$('pause').textContent='⏸ إيقاف الحركة'}
function togglePause(){paused=!paused;$('stage').classList.toggle('paused',paused);$('pause').textContent=paused?'▶ متابعة الحركة':'⏸ إيقاف الحركة'}
function replay(){show(current)}
async function share(){const url=location.href.split('#')[0]+'#'+demos[current][0];if(navigator.share){try{await navigator.share({title:'GiftCode',url});return}catch(e){if(e.name==='AbortError')return}}if(navigator.clipboard){try{await navigator.clipboard.writeText(url);alert('تم نسخ رابط المعاينة');return}catch(e){}}prompt('انسخ رابط المعاينة',url)}
const hash=location.hash.slice(1);show(Math.max(0,demos.findIndex(d=>d[0]===hash)));
</script></body></html>
